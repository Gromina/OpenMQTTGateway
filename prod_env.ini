; https://docs.openmqttgateway.com/use/rf.html#what-is-an-rf-gateway


;  CC1101    ESP32
;  GND  ---  GND
;  VCC  ---  3V3
;
;  GD0  ---  D12
;  GD2  ---  D27
;
;  CSN  ---  D5
;  SCK  ---  D18
;  SO   ---  D19
;  SI   ---  D23
;
;  WS2812    ESP32
;  VCC  ---  5V
;  GND  ---  GND
;  DI   ---  D14
;


[platformio]
default_envs =

  esp32-multi_receiver

[env:esp32-mini-multi_receiver]
platform = ${com.esp32_platform}
board = esp32doit-devkit-v1
board_build.partitions = min_spiffs.csv
board_upload.speed = 921600

lib_deps =
  ${com-esp32.lib_deps}
  ${libraries.rc-switch}
  ${libraries.smartrc-cc1101-driver-lib}
  ${libraries.esppilight}
  ${libraries.newremoteswitch}
  ${libraries.adafruit_neopixel}
build_flags =
  ${com-esp32.build_flags}

  '-DZgatewayRF="RF"'
  '-DZgatewayRF2="RF2"'
  '-DZgatewayPilight="Pilight"'
  '-DZradioCC1101="CC1101"'
  '-DGateway_Name="OMG_multi_receiver"'
  '-DvalueAsATopic=true'  ; MQTT topic includes model and device (rtl_433) or protocol and id (RF and PiLight)
; *** RF Module Options ***
  '-DRF_CC1101="CC1101"'  ; CC1101 Transceiver Module
  '-DRF_MODULE_GDO2=27'   ; CC1101 pin GDO2 receiver
  '-DRF_MODULE_GDO0=12'   ; CC1101 pin GDO0 emitter
  '-DRF_MODULE_SCK=18'   ; CC1101 pin SCK
  '-DRF_MODULE_MOSI=23'
  '-DRF_MODULE_MISO=19'
  '-DRF_MODULE_CS=5'      ; pin to be used as chip select
  '-DRF_MODULE_INIT_STATUS=true'    ; Display transceiver config during startup

  '-DDEFAULT_ADJ_BRIGHTNESS=50'
  '-DLED_ADDRESSABLE=true'
  '-DLED_ADDRESSABLE_PIN1=14'
  '-DLED_ADDRESSABLE_NUM=5'

  '-DLED_ERROR=4'
  '-DLED_PROCESSING=3'
  '-DLED_BROKER=2'
  '-DLED_NETWORK=1'
  '-DLED_POWER=0'
  '-DLED_NETWORK_OK_COLOR=0x00FF00'
  '-DLED_BROKER_OK_COLOR=0x00AAFF'
  '-DLED_POWER_COLOR=0x00AAAA'
  '-DLED_PROCESSING_COLOR=0xAAAA00'

custom_description = Multi RF library with the possibility to switch between RTL_433_ESP, NewRemoteSwitch and RCSwitch, need CC1101
